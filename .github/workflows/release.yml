name: Release

# A version tag builds the installer and the portable executable and publishes them as a draft release:
#   git tag v2.0.1 && git push origin refs/tags/v2.0.1
# A manual run (workflow_dispatch) builds and uploads artifacts without publishing.
#
# The build runs with read-only permissions, from a clean toolchain and no restored cache, so nothing
# from an earlier run can reach a release. Only the short publish job can write to the repository.
#
# Nothing here signs updates: a key in this repository's secrets would sign for anyone who takes over the account. A draft
# becomes an update on the machine with the key, after it has been checked: installer/publish-release.js, docs/rust/UPDATES.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: What the recording tests need
        shell: powershell
        run: |
          choco install ffmpeg -y --no-progress
          Import-Module ServerManager
          if ((Get-WindowsFeature Server-Media-Foundation).InstallState -ne 'Installed') {
            Install-WindowsFeature Server-Media-Foundation | Out-Null
          }
      - name: Rust tests
        run: cargo test --workspace --locked --no-fail-fast
      - name: Build
        run: cargo build --release -p shotik --locked
      - name: Contract tests
        run: node test/run-tests.js
      - name: Version must match the tag
        shell: bash
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 --locked | node -pe "JSON.parse(require('fs').readFileSync(0)).packages.find(p => p.name === 'shotik').version")
          echo "CRATE_VERSION=$crate" >> "$GITHUB_ENV"
          if [ -n "$TAG" ] && [ "v$crate" != "$TAG" ]; then
            echo "::error::tag $TAG does not match crate version $crate"
            exit 1
          fi
      - name: Installer
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe' }
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
            $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = (Resolve-Path target\release\shotik.exe).Path
          $out = Join-Path (Resolve-Path dist).Path "Shotik-Setup-$env:CRATE_VERSION.exe"
          & $makensis "/DVERSION=$env:CRATE_VERSION" "/DEXE=$exe" "/DOUT=$out" installer\shotik.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }
          Copy-Item $exe "dist\Shotik-$env:CRATE_VERSION-portable.exe"
      - name: Installer does what it says
        shell: powershell
        run: installer\smoke.ps1 -Setup (Resolve-Path "dist\Shotik-Setup-$env:CRATE_VERSION.exe").Path
      - name: The update works from end to end
        shell: bash
        run: node installer/update-smoke.js "$(pwd -W)/dist/Shotik-Setup-$CRATE_VERSION.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shotik-windows
          path: dist/*.exe
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shotik-windows
          path: dist
      - name: Draft release
        run: gh release create "$TAG" dist/*.exe --repo "$GITHUB_REPOSITORY" --draft --title "Shotik ${TAG#v}" --generate-notes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
