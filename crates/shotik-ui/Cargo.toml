[package]
name = "shotik-ui"
description = "All windows. Each window is pure state plus a view."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
shotik-core.workspace = true
serde.workspace = true
serde_json.workspace = true
raw-window-handle = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Pinned exactly: unstable-winit-030 is the integration point for raw window control and may change
# in a minor release. Slint is used under its Royalty-free Desktop license: see docs/rust/ARCHITECTURE.md.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-software",
    "software-renderer-path",
    "accessibility",
    "raw-window-handle-06",
    "unstable-winit-030",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[build-dependencies]
slint-build = "=1.18.1"
