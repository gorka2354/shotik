[package]
name = "shotik-win"
description = "Windows implementation of the platform ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
shotik-core.workspace = true
windows = { version = "0.62.2", features = [
    "Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
    "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO",
    "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading",
    "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json.workspace = true
