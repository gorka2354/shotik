<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'unsafe-inline'">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #11141a; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; }
  #wrap {
    position: fixed; inset: 0;
    -webkit-app-region: drag;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; overflow: hidden;
    transition: border-color .15s;
  }
  #wrap:hover { border-color: rgba(124, 92, 255, 0.65); }
  #img { width: 100%; height: 100%; object-fit: fill; display: block; pointer-events: none; }
  #hud {
    position: fixed; top: 6px; right: 6px; display: flex; gap: 4px; align-items: center;
    opacity: 0; transition: opacity .15s; -webkit-app-region: no-drag;
  }
  #wrap:hover ~ #hud, #hud:hover { opacity: 1; }
  .hud-btn {
    height: 22px; min-width: 22px; padding: 0 6px;
    border: none; border-radius: 6px; cursor: pointer;
    background: rgba(10, 12, 18, 0.85); color: #cdd3e0; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }
  .hud-btn:hover { background: rgba(255, 77, 94, 0.85); color: #fff; }
  #zoomLabel { cursor: default; }
  #zoomLabel:hover { background: rgba(10, 12, 18, 0.85); color: #cdd3e0; }
</style>
</head>
<body>
  <div id="wrap"><img id="img" alt=""></div>
  <div id="hud">
    <span class="hud-btn" id="zoomLabel">100%</span>
    <button class="hud-btn" id="btnClose" title="Закрыть (Esc / двойной клик)">✕</button>
  </div>
<script src="pin.js"></script>
</body>
</html>
