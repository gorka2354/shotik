<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
               display: flex; align-items: center; justify-content: center;
               font-family: 'Segoe UI', system-ui, sans-serif; }
  #n {
    font-size: 96px; font-weight: 800; color: #fff;
    text-shadow: 0 4px 24px rgba(0,0,0,0.6);
    width: 150px; height: 150px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(20, 20, 26, 0.55); border: 3px solid rgba(255,77,77,0.9);
    animation: pop .7s ease-out;
  }
  @keyframes pop { from { transform: scale(0.7); opacity: 0.3; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
  <div id="n">3</div>
  <script>
    let n = 3;
    const el = document.getElementById('n');
    const iv = setInterval(() => {
      n--;
      if (n <= 0) { clearInterval(iv); return; }
      el.textContent = n;
      el.style.animation = 'none'; void el.offsetWidth; el.style.animation = 'pop .7s ease-out';
    }, 700);
  </script>
</body>
</html>
