<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'unsafe-inline'">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { background: transparent; overflow: hidden; }
  body { font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; }
  #toast {
    display: flex; align-items: center; gap: 12px;
    margin: 6px; height: 80px; padding: 10px 14px 10px 10px;
    background: rgba(18, 20, 28, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    cursor: pointer;
    animation: in .28s cubic-bezier(.2, .9, .3, 1.15);
  }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } }
  #thumb {
    width: 84px; height: 60px; border-radius: 8px; flex: 0 0 auto;
    background: #262a36 center / cover no-repeat;
    border: 1px solid rgba(255,255,255,.09);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  #thumb.hiddenthumb { display: none; }
  #content { flex: 1; min-width: 0; }
  #title { color: #eef0f6; font-size: 13.5px; font-weight: 700; margin-bottom: 3px;
           display: flex; align-items: center; gap: 6px; }
  #title .dot { width: 7px; height: 7px; border-radius: 50%;
                background: linear-gradient(135deg, #7c5cff, #388eff); flex: 0 0 auto; }
  #body { color: #98a0b3; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #close {
    flex: 0 0 auto; width: 24px; height: 24px; border: none; border-radius: 7px;
    background: transparent; color: #6e7689; font-size: 14px; cursor: pointer; line-height: 1;
  }
  #close:hover { background: rgba(255,255,255,.08); color: #c9cfdd; }
</style>
</head>
<body>
  <div id="toast">
    <div id="thumb"></div>
    <div id="content">
      <div id="title"><span class="dot"></span><span id="titleText"></span></div>
      <div id="body"></div>
    </div>
    <button id="close">✕</button>
  </div>
<script src="toast.js"></script>
</body>
</html>
