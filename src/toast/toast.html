<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'unsafe-inline'">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  :root { --accent: #0067C0; }
  @media (prefers-color-scheme: dark) {
    :root { --t-bg: rgba(32, 32, 34, 0.96); --t-border: rgba(255,255,255,.09); --t-text: #f0f0f2;
            --t-dim: rgba(255,255,255,.55); --t-thumb: #1a1a1c; --t-hover: rgba(255,255,255,.08); }
  }
  @media (prefers-color-scheme: light) {
    :root { --t-bg: rgba(249, 249, 250, 0.97); --t-border: rgba(0,0,0,.08); --t-text: #1b1b1b;
            --t-dim: rgba(0,0,0,.55); --t-thumb: #e8e8ea; --t-hover: rgba(0,0,0,.06); }
  }
  html, body { background: transparent; overflow: hidden; }
  body { font-family: 'Segoe UI Variable Text', 'Segoe UI', -apple-system, system-ui, sans-serif; }
  #toast {
    display: flex; align-items: center; gap: 12px;
    margin: 6px; height: 80px; padding: 10px 14px 10px 10px;
    background: var(--t-bg);
    border: 1px solid var(--t-border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    cursor: pointer;
    animation: in .25s cubic-bezier(.2, .9, .3, 1.1);
  }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } }
  #thumb {
    width: 84px; height: 60px; border-radius: 5px; flex: 0 0 auto;
    background: var(--t-thumb) center / cover no-repeat;
    border: 1px solid var(--t-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  #content { flex: 1; min-width: 0; }
  #title { color: var(--t-text); font-size: 13px; font-weight: 600; margin-bottom: 3px;
           display: flex; align-items: center; gap: 7px; }
  #title .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
  #body { color: var(--t-dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #close {
    flex: 0 0 auto; width: 24px; height: 24px; border: none; border-radius: 5px;
    background: transparent; color: var(--t-dim); font-size: 13px; cursor: pointer; line-height: 1;
  }
  #close:hover { background: var(--t-hover); color: var(--t-text); }
</style>
</head>
<body>
  <div id="toast">
    <div id="thumb"></div>
    <div id="content">
      <div id="title"><span class="dot"></span><span id="titleText"></span></div>
      <div id="body"></div>
    </div>
    <button id="close">✕</button>
  </div>
<script src="toast.js"></script>
</body>
</html>
