<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  :root { --accent: #0067C0; --accent-text: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: rgba(30,30,34,0.97); --border: rgba(255,255,255,0.1); --text: #f0f0f2;
            --dim: rgba(255,255,255,0.5); --field: rgba(255,255,255,0.06); --hover: rgba(255,255,255,0.08); }
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: rgba(250,250,251,0.98); --border: rgba(0,0,0,0.09); --text: #1b1b1b;
            --dim: rgba(0,0,0,0.5); --field: rgba(0,0,0,0.04); --hover: rgba(0,0,0,0.06); }
  }
  html, body { background: transparent; overflow: hidden; }
  body { font-family: 'Segoe UI Variable Text','Segoe UI',-apple-system,system-ui,sans-serif; }
  #card {
    margin: 8px; padding: 12px 14px 14px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.4); -webkit-app-region: drag;
    animation: in .16s ease-out;
  }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  #head { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  #head svg { width: 16px; height: 16px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #title { font-size: 12.5px; font-weight: 700; color: var(--text); }
  #meta { font-size: 11px; font-family: Consolas,monospace; color: var(--dim); }
  #close { margin-left: auto; width: 22px; height: 22px; border: none; border-radius: 6px; background: transparent; color: var(--dim); cursor: pointer; font-size: 13px; -webkit-app-region: no-drag; }
  #close:hover { background: var(--hover); color: var(--text); }
  #orig { font-size: 12px; color: var(--dim); line-height: 1.4; margin-bottom: 8px; max-height: 60px; overflow-y: auto; white-space: pre-wrap; -webkit-app-region: no-drag; user-select: text; }
  #trans { font-size: 14.5px; color: var(--text); line-height: 1.5; white-space: pre-wrap;
           max-height: 220px; overflow-y: auto; -webkit-app-region: no-drag; user-select: text; cursor: text;
           padding: 9px 11px; border-radius: 8px; background: var(--field); }
  #trans.loading { color: var(--dim); font-style: italic; }
  #copy { -webkit-app-region: no-drag; margin-top: 10px; width: 100%; height: 32px; border: none; border-radius: 8px;
          background: var(--accent); color: var(--accent-text); font-weight: 600; font-family: inherit; font-size: 12.5px; cursor: pointer; }
  #copy:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <div id="card">
    <div id="head">
      <svg viewBox="0 0 24 24"><path d="M4 5h7"/><path d="M7 5v.5C7 9 5.5 12 3 13"/><path d="M5 9c0 2 2 3.5 5 4.5"/><path d="M12 20l4-9 4 9"/><path d="M13.5 17h5"/></svg>
      <span id="title">Translation</span>
      <span id="meta"></span>
      <button id="close">✕</button>
    </div>
    <div id="orig"></div>
    <div id="trans" class="loading"></div>
    <button id="copy">Copy translation</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
